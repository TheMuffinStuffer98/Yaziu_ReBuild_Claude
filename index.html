<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tagebuch">
  <meta name="theme-color" content="#1f7a5a">
  <title>Fitness-Tagebuch</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // Gespeicherte Darstellung sofort anwenden, damit die Seite nicht kurz in der falschen Farbe aufblitzt
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('ft.theme') || '{}');
        var r = document.documentElement;
        if (t.mode === 'light' || t.mode === 'dark') r.setAttribute('data-theme', t.mode);
        if (t.accent) r.style.setProperty('--accent-base', t.accent);
      } catch (e) { /* Standard-Darstellung */ }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topline">
      <span></span>
      <span id="title">Tagebuch</span>
      <span id="profile-badge" class="muted"></span>
    </div>
    <div id="subbar" class="subbar"></div>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabs" aria-label="Hauptmenü">
    <button data-tab="diary">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5v-15z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H19v-5"/><path d="M8.5 7.5h6"/></svg>
      <span>Tagebuch</span>
    </button>
    <button data-tab="cook">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v7a2.5 2.5 0 0 0 5 0V3"/><path d="M9.5 3v18"/><path d="M17.5 21V3c-2.3 1.2-3.5 3.7-3.5 6.5 0 2 1 3.5 3.5 3.5"/></svg>
      <span>Kochbuch</span>
    </button>
    <button data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 17.5 9 11.5l4 3.5 7.5-9"/><path d="M15 6h5.5v5.5"/><path d="M3.5 21h17"/></svg>
      <span>Fortschritt</span>
    </button>
    <button data-tab="profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.6-4 3.8-6 7.5-6s6.9 2 7.5 6"/></svg>
      <span>Profil</span>
    </button>
  </nav>

  <div id="editor" class="page" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="dialog" class="modal dialog-host" hidden></div>
  <div id="toast" class="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button id="toast-btn" data-action="toast-action" hidden></button>
  </div>

  <script src="js/store.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/foods.js"></script>
  <script src="js/parse.js"></script>
  <script src="js/coach.js"></script>
  <script src="js/dishes.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/vision.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

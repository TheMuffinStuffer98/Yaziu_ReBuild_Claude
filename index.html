<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tagebuch">
  <meta name="theme-color" content="#1f7a5a">
  <title>Fitness-Tagebuch</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <span id="title">Tagebuch</span>
    <span id="profile-badge" class="muted"></span>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabs" aria-label="Hauptmenü">
    <button data-tab="diary">Tagebuch</button>
    <button data-tab="weight">Gewicht</button>
    <button data-tab="train">Training</button>
    <button data-tab="stats">Auswertung</button>
    <button data-tab="coach">Coach</button>
    <button data-tab="more">Mehr</button>
  </nav>

  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/store.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/foods.js"></script>
  <script src="js/parse.js"></script>
  <script src="js/coach.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
